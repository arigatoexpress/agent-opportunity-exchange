substitutions:
  _REGION: us-central1
  _SERVICE: aoe-hackathon-preview

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/aoe-hackathon-preview:$SHORT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "gcr.io/$PROJECT_ID/aoe-hackathon-preview:$SHORT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=gcr.io/$PROJECT_ID/aoe-hackathon-preview:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--set-env-vars=NODE_ENV=production,AOE_PAYMENT_MODE=simulated"
      - "--labels=app=agent-opportunity-exchange,preview=hackathon-0g"
      - "--quiet"

images:
  - "gcr.io/$PROJECT_ID/aoe-hackathon-preview:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
